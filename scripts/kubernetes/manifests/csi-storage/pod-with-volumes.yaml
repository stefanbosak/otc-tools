apiVersion: v1
kind: Pod
metadata:
  name: sample-storage-consumer
  namespace: sample-workload
spec:
  containers:
    - name: busybox
      image: busybox:1.36
      command: ["sleep", "3600"]
      volumeMounts:
        - name: disk
          mountPath: /mnt/disk
        - name: obs
          mountPath: /mnt/obs
  volumes:
    - name: disk
      persistentVolumeClaim:
        claimName: sample-disk
    - name: obs
      persistentVolumeClaim:
        claimName: sample-obs
