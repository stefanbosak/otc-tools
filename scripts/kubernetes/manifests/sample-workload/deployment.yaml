apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-workload
  namespace: sample-workload
  labels:
    app: sample-workload
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sample-workload
  template:
    metadata:
      labels:
        app: sample-workload
    spec:
      containers:
        - name: sample-workload
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
